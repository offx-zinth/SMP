name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Daily security scanning at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  security-audit:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install uv
        run: pip install uv
      
      - name: Initialize uv venv
        run: uv venv
      
      - name: Install dependencies
        run: uv pip install -e ".[dev]"
      
      - name: Scan for known vulnerabilities with pip-audit
        run: |
          uv pip install pip-audit
          # Run pip-audit and generate report
          # Exit code 64 = vulnerabilities found with fixes, we fail the build
          # Exit code 65 = vulnerabilities found without fixes, we fail the build
          . .venv/bin/activate && pip-audit --desc
        continue-on-error: true
      
      - name: Generate vulnerability report
        if: always()
        run: |
          . .venv/bin/activate
          pip-audit --desc --format json > vulnerability-report.json || true
          cat vulnerability-report.json
      
      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: vulnerability-report
          path: vulnerability-report.json
          retention-days: 30
      
      - name: Comment PR with findings
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = {};
            try {
              report = JSON.parse(fs.readFileSync('vulnerability-report.json', 'utf8'));
            } catch (e) {
              console.log('No vulnerability report generated');
            }
            
            if (report.vulnerabilities && report.vulnerabilities.length > 0) {
              const vulns = report.vulnerabilities;
              let comment = `## 🔒 Security Audit Results\n\n`;
              comment += `Found ${vulns.length} vulnerable dependencies:\n\n`;
              
              vulns.forEach((v, i) => {
                comment += `${i + 1}. **${v.name}** v${v.installed_version}\n`;
                comment += `   - Vulnerability: ${v.vulnerability_id}\n`;
                if (v.fixed_versions && v.fixed_versions.length > 0) {
                  comment += `   - Fixed in: ${v.fixed_versions.join(', ')}\n`;
                }
                comment += `\n`;
              });
              
              comment += `Please address these vulnerabilities before merging.\n`;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }
  
  dependency-check:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install uv
        run: pip install uv
      
      - name: Initialize uv venv
        run: uv venv
      
      - name: Check for outdated dependencies
        run: |
          uv venv
          . .venv/bin/activate
          pip install --upgrade pip setuptools wheel
          pip list --outdated
        continue-on-error: true
